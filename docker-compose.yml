services:
  django:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - FLASK_CERTIFICATE_URL=http://nginx/

  flask:
    build: ./flask_service
    ports:
      - "5000:5000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    environment:
      - FLASK_DEBUG=0

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django
      - flask
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/api/v2/health/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
