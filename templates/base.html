<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EcoFarm{% endblock %}</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="navbar navbar-dark bg-success shadow-sm">
        <nav class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'core:home' %}">
                <span class="text-white">🌱 EcoFarm</span>
            </a>
            <ul class="nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'core:home' %}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'core:shop' %}">Tienda</a>
                </li>
                {% if cart_count %}
                <li class="nav-item">
                    <a class="nav-link text-white position-relative" href="{% url 'core:view_cart' %}">
                        🛍️ Carrito
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            {{ cart_count }}
                        </span>
                    </a>
                </li>
                {% endif %}
            </ul>
        </nav>
    </header>
    
    <main class="min-vh-100">
        {% block content %}
        {% endblock %}
    </main>
    
    <footer class="bg-success text-white text-center py-4 mt-5">
        <p class="mb-0">&copy; 2026 EcoFarm. Productos ecológicos de calidad.</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
